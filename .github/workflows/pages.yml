# Builds this repo's Markdown into static pages and deploys them to GitHub Pages,
# with the shared CSI Microscopy workflow (csi-Microscopy.github.io/tools/build-docs).
# Needs Settings → Pages → Source: "GitHub Actions"; until then the deploy job
# fails and the site keeps being served from the branch as before.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'   # weekly, so changes to the shared header/CSS/build reach this site

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  site:
    uses: CSI-Microscopy/csi-Microscopy.github.io/.github/workflows/build-instrument-site.yml@main
    with:
      repo: Skyscan-1272-MicroCT
      site: site.json
